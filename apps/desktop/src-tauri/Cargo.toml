[package]
name = "mirra-desktop"
version = "0.1.0"
description = "Mirra desktop app — the shared web UI in a native Tauri 2 shell"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "mirra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS credential stores: macOS Keychain, Windows Credential Manager, Secret Service on Linux.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
