[project]
name = "mirra-backend"
version = "0.1.0"
description = "Mirra API — auth, products, marketplace connectors, wardrobe, outfits, AI stylist."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "pgvector>=0.5",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "email-validator>=2.3",
  "pyjwt>=2.15",
  "argon2-cffi>=25.1",
  "httpx>=0.28",
  "redis>=8.1",
  "python-multipart>=0.0.33",
  "anthropic>=2.8.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.5",
  "ruff>=0.17",
  "mypy>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501", "RUF001", "RUF003"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["mirra"]
