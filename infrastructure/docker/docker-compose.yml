# Local development services.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d            # db, redis, object storage
#   docker compose -f infrastructure/docker/docker-compose.yml --profile api up  # + the API container
name: mirra

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mirra
      POSTGRES_PASSWORD: mirra
      POSTGRES_DB: mirra
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirra -d mirra"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for uploads and garment assets (Phase 3+).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mirra
      MINIO_ROOT_PASSWORD: mirra-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  api:
    profiles: ["api"]
    build:
      context: ../../apps/backend
    environment:
      MIRRA_ENV: development
      MIRRA_DATABASE_URL: postgresql+asyncpg://mirra:mirra@postgres:5432/mirra
      MIRRA_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  minio:
