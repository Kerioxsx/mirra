name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mirra
          POSTGRES_PASSWORD: mirra
          POSTGRES_DB: mirra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mirra" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/backend
    env:
      MIRRA_DATABASE_URL: postgresql+asyncpg://mirra:mirra@localhost:5432/mirra_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Migrations apply, reverse and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  frontend:
    name: Frontend (lint, types, unit tests, contracts, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/backend
      - name: Generated API types match the backend
        run: pnpm check:api
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @mirra/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 7

  e2e:
    name: End-to-end (static export + API + Postgres)
    runs-on: ubuntu-24.04
    needs: frontend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mirra
          POSTGRES_PASSWORD: mirra
          POSTGRES_DB: mirra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mirra" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MIRRA_DATABASE_URL: postgresql+asyncpg://mirra:mirra@localhost:5432/mirra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/backend
      - run: uv run alembic upgrade head
        working-directory: apps/backend
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - run: pnpm --filter @mirra/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  desktop:
    name: Desktop (Tauri on Linux / WebKitGTK)
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - name: Unit tests (secure-store allow-list)
        run: cargo test --locked
        working-directory: apps/desktop/src-tauri
      - name: Compile with embedded frontend assets
        run: cargo build --locked --features tauri/custom-protocol
        working-directory: apps/desktop/src-tauri
